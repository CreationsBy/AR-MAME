name: ARMAME
options:
  bundleIdPrefix: com.creationsby
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ARCHS: arm64
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GENERATE_INFOPLIST_FILE: NO
targets:
  ARMAME:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - Resources
          - Info.plist
      - path: ios/Resources
        buildPhase: resources
      - path: reconstruction/profiles
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creationsby.armame
        PRODUCT_NAME: ARMAME
        INFOPLIST_FILE: ios/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ios/Bridge/Bridging.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/mame
          - $(SRCROOT)/vendor/mame2003-plus/src/libretro-common/include
        OTHER_LDFLAGS:
          - -lcompression
          - -lz
          - -liconv
    dependencies:
      - library: build/core/libarmame.a
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
    scheme:
      gatherCoverageData: false
